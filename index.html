<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Ijlal Assami | Portfolio</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=DM+Sans:wght@400;500;700&family=Press+Start+2P&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <!-- Header -->
        <header>
            <nav class="container nav" aria-label="Main navigation">
                <a href="#home" class="logo">I<span>.</span>A</a>

                <ul class="nav-links" id="navLinks">
                    <li><a href="#home" class="active">Home</a></li>
                    <li><a href="#about">About</a></li>
                    <li><a href="#skills">Skills</a></li>
                    <li><a href="#projects">Projects</a></li>
                    <li><a href="#contact">Contact</a></li>
                </ul>

                <button class="menu-btn" id="menuBtn" aria-label="Open menu" aria-expanded="false">☰</button>
            </nav>
        </header>

        <main>
            <!-- Home -->
            <section id="home" class="hero">
                <div class="container hero-grid">
                    <div>
                        <p class="tag">Player 1 ready!</p>
                        <h1>Hi, I'm Ijlal. I build things for the <em>web</em>.</h1>

                        <p class="lead">
                            Aspiring web developer from Indonesia, currently <span class="typing" id="typing"></span>
                        </p>

                        <div class="actions">
                            <a href="#about" class="btn btn-primary">▶ Start</a>
                            <a href="#projects" class="btn btn-ghost">See my projects</a>
                            <a href="#contact" class="btn btn-ghost">Send message</a>
                        </div>
                    </div>

                    <!-- Player card -->
                    <div class="player-card">
                        <div class="photo-frame">
                            <svg id="photoPlaceholder" viewBox="0 0 200 250" role="img" aria-label="Photo placeholder">
                                <rect width="200" height="250" fill="var(--surface-2)"/>
                                <circle cx="100" cy="95" r="38" fill="var(--accent)" opacity="0.85"/>
                                <path d="M25 250c4-60 38-85 75-85s71 25 75 85z" fill="var(--accent-2)" opacity="0.9"/>
                            </svg>
                            <img id="photoImg" alt="Portrait of Ijlal Assami" hidden>
                        </div>

                        <div class="player-info">
                            <p class="player-name">IJLAL ASSAMI</p>
                            <p class="player-class">Class: Web Developer</p>

                            <div class="meter">
                                <span>Learning XP</span>
                                <div class="meter-track">
                                    <i data-fill="60"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <script src="js/main.js" defer></script>
    </body>
</html>
